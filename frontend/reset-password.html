<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#143e2c">
  <title>Set New Password — FarmSaathi AI</title>
  <meta name="description" content="Update your password for FarmSaathi AI.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">

  <!-- MODULAR STYLESHEETS -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">

  <!-- SUPABASE CLIENT & AUTH SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/auth.js"></script>
</head>
<body class="landing-body">

  <div class="auth-page-wrapper">
    <!-- Brand Header -->
    <div class="auth-brand-head">
      <a href="/" class="brand" style="text-decoration: none; justify-content: center; margin-bottom: 8px;">
        <div class="brand-logo">🌱</div>
        <div style="text-align: left;">
          <div class="brand-title">FarmSaathi <span>AI</span></div>
          <div class="brand-sub">Smart Farmer Platform</div>
        </div>
      </a>
    </div>

    <!-- Reset Card -->
    <div class="auth-card-panel">
      <h1 class="auth-card-title">Set New Password</h1>
      <p class="auth-card-sub">
        Choose a strong password with at least 6 characters for your FarmSaathi AI farmer account.
      </p>

      <form id="formResetPass" class="fields-grid" novalidate onsubmit="handleResetPasswordSubmit(event)">
        <!-- New Password -->
        <label class="field full">
          <span>New Password <b style="color: var(--danger);">*</b></span>
          <div class="password-input-wrap">
            <input class="input" id="newPassword" type="password" placeholder="At least 6 characters" minlength="6" autocomplete="new-password" required oninput="validateNewPassword()">
            <button type="button" class="btn-toggle-eye" id="btnToggleNewPass" onclick="togglePasswordVisibility('newPassword', 'btnToggleNewPass')" aria-label="Toggle password visibility">👁️</button>
          </div>
          <small id="newPassRules" style="font-size: 11.5px; color: var(--muted); margin-top: 4px;">
            Password must be at least 6 characters.
          </small>
        </label>

        <!-- Confirm New Password -->
        <label class="field full">
          <span>Confirm New Password <b style="color: var(--danger);">*</b></span>
          <div class="password-input-wrap">
            <input class="input" id="confirmNewPassword" type="password" placeholder="Re-enter new password" minlength="6" autocomplete="new-password" required oninput="validateNewPasswordMatch()">
            <button type="button" class="btn-toggle-eye" id="btnToggleConfirmNewPass" onclick="togglePasswordVisibility('confirmNewPassword', 'btnToggleConfirmNewPass')" aria-label="Toggle confirm password visibility">👁️</button>
          </div>
          <small id="confirmNewPassError" style="color: var(--danger); font-size: 11.5px; display: none;">Passwords do not match.</small>
        </label>

        <!-- Submit Button -->
        <div class="field full" style="margin-top: 10px;">
          <button type="submit" class="btn btn-primary" id="btnSubmitNewPass" style="width: 100%; padding: 12px; font-size: 14.5px;">
            Update Password
          </button>
        </div>
      </form>

      <!-- Status Feedback Box -->
      <div id="resetStatusMsg" class="status-msg"></div>

      <div class="auth-divider">OR</div>

      <div class="auth-footer-nav">
        Remembered your password? <a href="login.html">Sign in here</a>
      </div>

      <div style="margin-top: 14px; text-align: center; font-size: 12.5px;">
        <a href="/" style="color: var(--muted); text-decoration: none;">← Back to FarmSaathi Home</a>
      </div>
    </div>
  </div>

  <script>
    function togglePasswordVisibility(inputId, btnId) {
      var input = document.getElementById(inputId);
      var btn = document.getElementById(btnId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        if (btn) btn.textContent = '🙈';
      } else {
        input.type = 'password';
        if (btn) btn.textContent = '👁️';
      }
    }

    function validateNewPassword() {
      var pass = (document.getElementById('newPassword') && document.getElementById('newPassword').value) || '';
      var rules = document.getElementById('newPassRules');
      if (!rules) return;
      if (pass.length >= 6) {
        rules.style.color = 'var(--success)';
        rules.textContent = '✓ Password meets requirements';
      } else {
        rules.style.color = 'var(--muted)';
        rules.textContent = 'Password must be at least 6 characters.';
      }
      validateNewPasswordMatch();
    }

    function validateNewPasswordMatch() {
      var pass = (document.getElementById('newPassword') && document.getElementById('newPassword').value) || '';
      var confirm = (document.getElementById('confirmNewPassword') && document.getElementById('confirmNewPassword').value) || '';
      var err = document.getElementById('confirmNewPassError');
      if (!err) return;
      if (confirm && pass !== confirm) {
        err.style.display = 'block';
        err.textContent = 'Passwords do not match.';
      } else {
        err.style.display = 'none';
      }
    }

    async function handleResetPasswordSubmit(e) {
      e.preventDefault();

      var pass = (document.getElementById('newPassword') && document.getElementById('newPassword').value) || '';
      var confirm = (document.getElementById('confirmNewPassword') && document.getElementById('confirmNewPassword').value) || '';
      var statusMsg = document.getElementById('resetStatusMsg');
      var btn = document.getElementById('btnSubmitNewPass');

      if (!pass || pass.length < 6) {
        if (statusMsg) {
          statusMsg.className = 'status-msg show err';
          statusMsg.textContent = 'Password must be at least 6 characters.';
        }
        return;
      }

      if (pass !== confirm) {
        if (statusMsg) {
          statusMsg.className = 'status-msg show err';
          statusMsg.textContent = 'Passwords do not match.';
        }
        return;
      }

      if (btn) {
        btn.classList.add('btn-submit-loading');
        btn.disabled = true;
        btn.textContent = 'Updating Password…';
      }

      try {
        var res = await window.AuthModule.performPasswordReset(pass);
        if (statusMsg) {
          statusMsg.className = 'status-msg show ok';
          statusMsg.innerHTML = '<b>Password Updated Successfully! ✓</b><br>You can now sign in with your new password. Redirecting to login…';
        }
        setTimeout(function() {
          window.location.href = 'login.html';
        }, 1800);
      } catch (err) {
        console.error('Password reset error:', err);
        if (statusMsg) {
          statusMsg.className = 'status-msg show err';
          statusMsg.textContent = err.message || 'Unable to update password. Your reset link may have expired.';
        }
        if (btn) {
          btn.classList.remove('btn-submit-loading');
          btn.disabled = false;
          btn.textContent = 'Update Password';
        }
      }
    }
  </script>
</body>
</html>
